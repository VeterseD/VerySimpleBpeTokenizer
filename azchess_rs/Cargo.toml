[package]
name = "azchess_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "azchess_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
shakmaty = { version = "0.30" }
rayon = "1.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
